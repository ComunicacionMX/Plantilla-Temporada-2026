<style>
/* Layout: revista de 4 hojas horizontales del mismo tamaño (16:9) sobre fondo negro; una hoja a la vez, que gira como página. */
:root {
  --stage: #0A0A0B;
  --ink: #ECEDEF;
  --muted: #9EA2A8;
  --silver: #C8CCD1;
  --line: rgba(200, 204, 209, 0.28);
  --paper: #ECEBE8;
  --display: 'Bodoni Moda', Didot, 'Times New Roman', serif;
  --ui: Montserrat, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--stage);
  color: var(--ink);
  font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 16px;
}
img { max-width: 100%; }
.wrap { max-width: 1320px; min-height: calc(100dvh - 32px); margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
header { position: absolute; top: 16px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto !important; max-width: 1320px; margin: 0 auto; }
body { position: relative; }
header { width: 100%; display: flex; align-items: center; gap: 16px; }
header h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 18px; letter-spacing: 0.28em; white-space: nowrap; }
header h1 span { font-family: var(--ui); font-weight: 500; font-size: 14px; letter-spacing: 0.36em; color: var(--silver); }
header .rule { flex: 1; height: 1px; background: var(--line); }
header p { margin: 0; font-size: 10.5px; font-weight: 500; letter-spacing: 0.32em; color: var(--muted); white-space: nowrap; }
header p.date { font-family: var(--display); font-size: 18px; letter-spacing: 0.24em; color: var(--silver); font-variant-numeric: lining-nums; }

.book { display: grid; width: min(100%, 1240px, calc((100dvh - 150px) * 16 / 9)); margin-top: 28px; perspective: 2400px; }
.page { grid-area: 1 / 1; z-index: 1; position: relative; margin: 0; width: 100%; align-self: start; background: var(--paper); border-radius: 4px; box-shadow: 0 24px 60px rgba(0,0,0,0.55); backface-visibility: hidden; transform-origin: left center; transition: transform 0.7s cubic-bezier(.3,.7,.2,1), opacity 0.5s; }
.page img { display: block; width: 100%; aspect-ratio: 16 / 9; height: auto; object-fit: cover; border-radius: 4px; }
.page.before { transform: rotateY(-100deg); transform-origin: left center; opacity: 0; z-index: 2; pointer-events: none; visibility: hidden; transition: transform 0.7s cubic-bezier(.3,.7,.2,1), opacity 0.5s, visibility 0s 0.7s; }
.page.after { transform: rotateY(0deg); opacity: 0; pointer-events: none; visibility: hidden; transition: transform 0.7s cubic-bezier(.3,.7,.2,1), opacity 0.5s, visibility 0s 0.7s; }
.page:not(.current) { position: absolute; inset: 0 0 auto 0; }
.zoom { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(5,5,6,0.96); display: flex; flex-direction: column; }
.lb[hidden] { display: none !important; }
.lb-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.lb-bar p { margin: 0; font-size: 11px; letter-spacing: 0.24em; color: var(--muted); }
.lb-bar button { min-width: 44px; min-height: 44px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 11px var(--ui); letter-spacing: 0.24em; padding: 0 14px; cursor: pointer; }
.lb-view { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; cursor: zoom-in; touch-action: pan-x pan-y pinch-zoom; }
.lb-view.on { cursor: grab; }
.lb-view.drag { cursor: grabbing; }
.lb-view img { display: block; margin: auto; width: 100%; height: auto; max-width: none; user-select: none; -webkit-user-drag: none; }
.lb-view.on img { width: 250%; }
.hot { position: absolute; display: block; border-radius: 4px; outline-offset: 3px; }
.hot:hover { background: rgba(255,255,255,0.06); }
.hot:focus-visible { outline: 2px solid var(--silver); }

.controls { display: flex; align-items: center; gap: 14px; padding: 6px 10px; background: rgba(10,10,11,0.85); border: 1px solid var(--line); }
.controls button { min-width: 44px; min-height: 44px; padding: 0 16px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-family: var(--ui); font-size: 11px; font-weight: 500; letter-spacing: 0.28em; cursor: pointer; }
.controls button:disabled { opacity: 0.35; cursor: default; }
.controls button:focus-visible { outline: 2px solid var(--silver); outline-offset: 2px; }
.folio { font-family: var(--display); font-size: 18px; color: var(--silver); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 8px; }
.dots button { min-width: 0; min-height: 0; width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 1px solid var(--silver); background: transparent; }
.dots button[aria-current="true"] { background: var(--silver); }
@media (max-width: 760px) { header p.date { font-size: 14px; } header h1 { font-size: 14px; } header h1 span { font-size: 11px; } .controls button.txt { padding: 0 12px; letter-spacing: 0.1em; } }
.hint { display: none; margin: 0; font-size: 11px; letter-spacing: 0.18em; color: var(--muted); text-align: center; }
@media (max-width: 760px) and (orientation: portrait) { .hint { display: block; } }
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 4px; }
.shine { position: absolute; overflow: hidden; mix-blend-mode: screen; }
.shine::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 35%; left: -40%; background: linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 100%); animation: sweep 4.5s ease-in-out infinite 0.6s; }
@keyframes sweep { 0% { left: -40%; } 45%, 100% { left: 110%; } }
.spark { position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%) scale(0); filter: drop-shadow(0 0 4px rgba(255,255,255,0.95)) drop-shadow(0 0 1px rgba(85,88,94,0.7)); animation: twinkle 2.6s ease-in-out infinite; }
.spark svg { display: block; width: 100%; height: 100%; fill: #FFFFFF; }
@keyframes twinkle { 0%, 55%, 100% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1) rotate(60deg); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .page, .book { transition: none; } .shine::after, .spark { animation: none; } }
</style>

<script>
(function () {
  var book = document.getElementById('book');
  var pages = [].slice.call(book.querySelectorAll('.page'));
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var folio = document.getElementById('folio');
  var n = pages.length, cur = 0;
  function pad(i) { return (i < 10 ? '0' : '') + i; }
  function go(i) {
    if (i < 0 || i >= n || i === cur) return;
    cur = i;
    pages.forEach(function (pg, k) {
      pg.classList.toggle('current', k === i);
      pg.classList.toggle('before', k < i);
      pg.classList.toggle('after', k > i);
    });
    folio.textContent = pad(i + 1) + ' / ' + pad(n);
    prev.disabled = i === 0;
    next.disabled = i === n - 1;
    var img = pages[i].querySelector('img[data-anim]');
    if (img) { var s = img.getAttribute('src'); img.setAttribute('src', ''); requestAnimationFrame(function () { img.setAttribute('src', s); }); }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  var names = ['ubicacion', 'looks', 'todomoda', 'isadora'];
  function fromHash() {
    var i = names.indexOf((location.hash || '').replace('#', '').toLowerCase());
    if (i >= 0) go(i);
  }
  var baseGo = go;
  go = function (i) { baseGo(i); if (names[i] && location.hash !== '#' + names[i]) { try { history.replaceState(null, '', '#' + names[i]); } catch (e) {} } };
  window.addEventListener('hashchange', fromHash);
  prev.addEventListener('click', function () { go(cur - 1); });
  next.addEventListener('click', function () { go(cur + 1); });
  var x0 = null;
  book.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  book.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) go(dx < 0 ? cur + 1 : cur - 1);
  });
  fromHash();
  document.addEventListener('keydown', function (e) {
    if (!document.getElementById('lb').hidden) return;
    if (e.key === 'ArrowRight') go(cur + 1);
    if (e.key === 'ArrowLeft') go(cur - 1);
  });
})();

(function () {
  var lb = document.getElementById('lb'), view = document.getElementById('lbView'), img = document.getElementById('lbImg');
  var hint = document.getElementById('lbHint'), closeBtn = document.getElementById('lbClose'), opener = null;
  function setZoom(on, cx, cy) {
    var r = view.getBoundingClientRect();
    var fx = cx == null ? 0.5 : (cx - r.left + view.scrollLeft) / img.offsetWidth;
    var fy = cy == null ? 0.5 : (cy - r.top + view.scrollTop) / img.offsetHeight;
    view.classList.toggle('on', on);
    hint.textContent = on ? 'ARRASTRA PARA MOVERTE · TOCA PARA ALEJAR' : 'TOCA LA IMAGEN PARA ACERCAR';
    requestAnimationFrame(function () {
      view.scrollLeft = fx * img.offsetWidth - view.clientWidth / 2;
      view.scrollTop = fy * img.offsetHeight - view.clientHeight / 2;
    });
  }
  document.querySelectorAll('.zoom').forEach(function (b) {
    b.addEventListener('click', function () {
      opener = b; img.src = b.dataset.src; img.alt = b.querySelector('img').alt;
      setZoom(false); lb.hidden = false; document.body.style.overflow = 'hidden'; closeBtn.focus();
    });
  });
  function close() { lb.hidden = true; document.body.style.overflow = ''; view.classList.remove('on'); if (opener) opener.focus(); }
  closeBtn.addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (!lb.hidden && e.key === 'Escape') close(); }, true);
  var down = null, moved = false;
  view.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY, sl: view.scrollLeft, st: view.scrollTop }; moved = false; });
  view.addEventListener('pointermove', function (e) {
    if (!down || e.pointerType === 'touch') return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) { moved = true; if (view.classList.contains('on')) { view.classList.add('drag'); view.scrollLeft = down.sl - dx; view.scrollTop = down.st - dy; } }
  });
  view.addEventListener('pointerup', function (e) {
    view.classList.remove('drag');
    if (down && !moved && Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) < 8) setZoom(!view.classList.contains('on'), e.clientX, e.clientY);
    down = null;
  });
})();
</script>
